[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-master-ai-api-supplier"
version = "0.2.0"
description = "Supplier Master AI Supplier microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy",
    "asyncpg",
]

[project.optional-dependencies]
ai = [
    "boto3>=1.35,<2.0",
]
retrieval = [
    "boto3>=1.35,<2.0",
    "opensearch-py>=2.8,<4.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<1.0",
     "alembic",
]
all = [
    "boto3>=1.35,<2.0",
    "opensearch-py>=2.8,<4.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<1.0",
    "alembic>=1.14,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_supplier*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
